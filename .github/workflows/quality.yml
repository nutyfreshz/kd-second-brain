name: RAG quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'streamlit>=1.40,<2' 'numpy>=1.26,<3'
      - run: python -m unittest discover -s tests -v
      - run: python benchmarks/retrieval_quality.py
