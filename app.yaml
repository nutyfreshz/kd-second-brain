command: ['streamlit', 'run', 'ui/streamlit_app.py']
env:
  - name: STREAMLIT_GATHER_USAGE_STATS
    value: "false"

  - name: OPENROUTER_API_KEY
    valueFrom: openrouter_api_key

  - name: OPENROUTER_MODEL
    value: "openai/gpt-oss-20b:free"

  - name: OPENROUTER_FREE_VERIFIED
    value: "true"

  - name: KNOWLEDGE_SOURCE
    value: "drive"

  - name: GOOGLE_DRIVE_PUBLISHED_FOLDER_ID
    value: "1zjXz_usBjV0GvGBVb9L19HcGLBCPV8yw"

  - name: GOOGLE_SERVICE_ACCOUNT_JSON
    valueFrom: google_service_account_json

  - name: DRIVE_EXTERNAL_LLM_ALLOW_ALL
    value: "true"